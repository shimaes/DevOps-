# ansible/deploy.yml

- name: Setup Server and Deploy Full DevOps Stack
  hosts: prod_servers  
  become: yes          
  vars:
    
    deployment_path: "{{ ansible_user_dir }}/financial_project" 
    telegram_bot_token: "{{ TELEGRAM_BOT_TOKEN | default('') }}"
    telegram_chat_id: "{{ TELEGRAM_CHAT_ID | default('') }}"

  handlers:
    - name: restart docker
      ansible.builtin.service:
        name: docker
        state: restarted

  tasks:
    
    
    - name: Stop unattended-upgrades service if running
      ansible.builtin.service:
        name: unattended-upgrades
        state: stopped
      ignore_errors: yes  

    - name: Disable unattended-upgrades service
      ansible.builtin.systemd:
        name: unattended-upgrades
        enabled: no
        masked: yes
      ignore_errors: yes  

    - name: Remove unattended-upgrades package to prevent future locks
      ansible.builtin.apt:
        name: unattended-upgrades
        state: absent
        purge: yes
        autoremove: yes  

    - name: Kill any process holding the apt lock
      ansible.builtin.shell: |
        if [ -e /var/lib/apt/lists/lock ]; then
          sudo fuser -k /var/lib/apt/lists/lock || true
        fi
        if [ -e /var/lib/dpkg/lock ]; then
          sudo fuser -k /var/lib/dpkg/lock || true
        fi
        if [ -e /var/lib/dpkg/lock-frontend ]; then
          sudo fuser -k /var/lib/dpkg/lock-frontend || true
        fi
      ignore_errors: yes  

    - name: Remove apt lock files if they still exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/apt/lists/lock
        - /var/lib/dpkg/lock
        - /var/lib/dpkg/lock-frontend
      ignore_errors: yes  

    - name: Wait for apt lock to be fully released
      ansible.builtin.wait_for:
        path: /var/lib/apt/lists/lock
        state: absent
        delay: 5   
        timeout: 120  

    
    
    - name: Install prerequisites for Docker repository
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes
        lock_timeout: 300
      retries: 5
      delay: 10

    - name: Create /etc/apt/keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Remove old Docker key files and sources
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/keyrings/docker.gpg
        - /etc/apt/keyrings/docker.asc
        - /usr/share/keyrings/docker.gpg
        - /usr/share/keyrings/docker.asc
        - /etc/apt/sources.list.d/docker.list
      ignore_errors: yes

    - name: Add Docker's official GPG key
      ansible.builtin.shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc
      retries: 5
      delay: 10

    - name: Set permissions for Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.asc
        mode: 'a+r'

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
        update_cache: yes
      retries: 5
      delay: 10

    - name: Remove conflicting Docker packages
      ansible.builtin.apt:
        name:
          - docker
          - docker-engine
          - docker.io
          - containerd
          - runc
        state: absent
        purge: yes
        autoremove: yes
      ignore_errors: yes  

    - name: Ensure Docker and dependencies are installed
      ansible.builtin.apt:
        name: 
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
        lock_timeout: 300  
      
      retries: 5
      delay: 10

    - name: Start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Set up Docker registry mirror with ArvanCloud
      ansible.builtin.copy:
        content: |
          {
            "registry-mirrors": ["https://mirror.arvancloud.ir/"]
          }
        dest: /etc/docker/daemon.json
        mode: '0644'
      notify: restart docker

    - name: Ensure Python Docker module is Installed (needed for docker_compose module)
      ansible.builtin.apt:
        name: python3-docker
        state: present

    - name: Create deployment directory
      ansible.builtin.file:
        path: "{{ deployment_path }}"
        state: directory
        owner: "{{ ansible_user_id }}"  
        mode: '0755'

    

    - name: Copy full deployment and configuration files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"  
        dest: "{{ deployment_path }}/{{ item }}"
        owner: "{{ ansible_user_id }}"  
        mode: '0644'
      loop:
        - docker-compose.yml   
        - prometheus.yml   
        - alert.rules.yml   
        - alertmanager.yml.j2     

    
    
    - name: Run docker-compose down to clean old containers
      community.docker.docker_compose_v2:
        project_src: "{{ deployment_path }}"
        state: absent
      ignore_errors: yes

    - name: Kill processes on ports 5000, 9090, 9093, 9094 to avoid conflicts
      ansible.builtin.shell: fuser -k 5000/tcp 9090/tcp 9093/tcp 9094/tcp || true
      ignore_errors: yes

    - name: Template alertmanager.yml with secrets
      ansible.builtin.template:  
        src: "{{ playbook_dir }}/../alertmanager.yml.j2"
        dest: "{{ deployment_path }}/alertmanager.yml"
        mode: '0644'
         
    - name: Run docker-compose up
      community.docker.docker_compose_v2:
        project_src: "{{ deployment_path }}"
        state: present
      environment:
       CI_REGISTRY_IMAGE: "{{ CI_REGISTRY_IMAGE }}"
       CI_COMMIT_SHORT_SHA: "{{ CI_COMMIT_SHORT_SHA }}"
       TELEGRAM_BOT_TOKEN: "{{ 8416513202:AAHqHYZIZmL0KE-l63AaM8xZbCVO_RG7GZc }}"  
       TELEGRAM_CHAT_ID: "{{ 201218583 }}"    

    - name: Check Flask service health after deployment
      ansible.builtin.uri:
        url: http://127.0.0.1:5000/health
        method: GET
        status_code: 200
      retries: 10  
      delay: 5    
      register: result
      until: result.status == 200